# Docker Compose for Dokploy.
# Deploy: create a project in Dokploy, choose "Docker Compose" as the source,
# paste this file (or connect the repo and point at it), then:
#   - API:    assign domain  api.panda.strikx.dev  (or panda.strikx.dev)  -> port 3001
#   - Admin:  assign domain  admin.panda.strikx.dev                      -> port 80
# Traefik routing is configured in the Dokploy UI; no labels needed here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pandago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy env}
      POSTGRES_DB: pandago
    volumes:
      - pandago-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pandago -d pandago']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/stripsior/panda-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pandago:${POSTGRES_PASSWORD}@postgres:5432/pandago
      PORT: 3001
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ghcr.io/stripsior/panda-admin:latest
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - api

volumes:
  pandago-pgdata:
