server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  # APKs are copied in at image build time (apps/web/apk/PandaGo.apk).
  types {
    application/vnd.android.package-archive apk;
  }

  location /apk/ {
    # Cloudflare caches .apk by default; the download link must always be fresh
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
