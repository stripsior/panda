<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PandaGo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #09090b; color: #fafafa; padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { color: #a1a1aa; margin: 10px 0 32px; line-height: 1.5; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px; border-radius: 14px; font-size: 17px; font-weight: 600;
    text-decoration: none; margin-bottom: 12px; transition: opacity .15s;
  }
  a.btn:active { opacity: .8; }
  .primary { background: #fafafa; color: #09090b; }
  .secondary { background: #18181b; color: #fafafa; border: 1px solid #27272a; }
  .hint { color: #71717a; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="100" height="100" rx="22" fill="#18181b"/>
    <circle cx="38" cy="42" r="7" fill="#fafafa"/>
    <circle cx="62" cy="42" r="7" fill="#fafafa"/>
    <circle cx="40" cy="43" r="3" fill="#09090b"/>
    <circle cx="60" cy="43" r="3" fill="#09090b"/>
    <ellipse cx="50" cy="60" rx="6" ry="4.5" fill="#fafafa"/>
    <circle cx="31" cy="66" r="6" fill="#27272a"/>
    <circle cx="69" cy="66" r="6" fill="#27272a"/>
  </svg>
  <h1>PandaGo</h1>
  <p class="sub">Gra terenowa — zdobądź punkty,<br />wykonując zadania na punktach kontrolnych.</p>
  <a class="btn primary" id="apkLink" href="/apk/PandaGo.apk" download>
    Pobierz aplikację (Android)
  </a>
  <a class="btn secondary" href="/app/">
    Otwórz wersję webową (iPhone i inne)
  </a>
  <p class="hint">Wersja webowa działa w przeglądarce — nic nie instalujesz.</p>
</main>
<script>
  // bust Cloudflare's APK edge cache: link to the exact released version
  fetch('/apk/VERSION').then(function (r) { return r.ok ? r.text() : null; }).then(function (v) {
    if (v) document.getElementById('apkLink').href = '/apk/PandaGo.apk?v=' + encodeURIComponent(v.trim());
  });
</script>
</body>
</html>
